services:
  mercure:
    image: dunglas/mercure:v0.18
    container_name: mobile_pos_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-dev-only-change-this-secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-dev-only-change-this-secret}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://127.0.0.1:8000
        publish_origins http://localhost:8000 http://127.0.0.1:8000
    ports:
      - "3000:80"

  database:
    image: mysql:8.0
    container_name: mobile_pos_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: mobile_pos
      MYSQL_USER: mobile_pos
      MYSQL_PASSWORD: mobile_pos
      MYSQL_ROOT_PASSWORD: root_mobile_pos

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "mobile_pos",
          "-pmobile_pos"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  database_dev:
    image: mysql:8.0
    container_name: dev_mobile_pos_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: dev_mobile_pos
      MYSQL_USER: dev_mobile_pos
      MYSQL_PASSWORD: dev_mobile_pos
      MYSQL_ROOT_PASSWORD: root_mobile_pos

    ports:
      - "3308:3306"

    volumes:
      - dev_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "dev_mobile_pos",
          "-pdev_mobile_pos"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mysql_data:
  dev_mysql_data:
