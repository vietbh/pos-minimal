services:
  database:
    image: mysql:8.0
    container_name: mobile_pos_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: mobile_pos
      MYSQL_USER: mobile_pos
      MYSQL_PASSWORD: mobile_pos
      MYSQL_ROOT_PASSWORD: root_mobile_pos

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "mobile_pos",
          "-pmobile_pos"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
