# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.bank_transfer_completion_policy_default: 'MANUAL'
    app.bank_transfer_completion_policy: '%env(default:app.bank_transfer_completion_policy_default:POS_BANK_TRANSFER_COMPLETION_POLICY)%'
    app.webhook_timezone_default: 'Asia/Ho_Chi_Minh'
    app.webhook_future_skew_seconds_default: 300

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $rootPath: '%kernel.project_dir%/%env(PRODUCT_IMAGE_STORAGE_ROOT)%'

    App\Application\Common\Storage\FileStorageInterface:
        alias: App\Infrastructure\Storage\LocalFileStorage

    App\Application\SalesPoint\CurrentSalesPoint:
        alias: App\Application\SalesPoint\SessionCurrentSalesPoint

    App\Infrastructure\Image\ImageMagickProcessor:
        arguments:
            $binary: '%env(IMAGE_MAGICK_BINARY)%'

    App\Application\Product\Image\ImageProcessorInterface:
        alias: App\Infrastructure\Image\ImageMagickProcessor

    App\Command\CleanupOrphanFilesCommand:
        arguments:
            $storageRoot: '%kernel.project_dir%/%env(PRODUCT_IMAGE_STORAGE_ROOT)%'

    App\Application\Payment\Webhook\BankNotificationWebhookHandler:
        arguments:
            $webhookTimezone: '%env(default:app.webhook_timezone_default:POS_WEBHOOK_TIMEZONE)%'
            $futureSkewSeconds: '%env(int:POS_WEBHOOK_FUTURE_SKEW_SECONDS)%'


    App\Controller\HealthController:
        arguments:
            $storageRoot: '%kernel.project_dir%/%env(PRODUCT_IMAGE_STORAGE_ROOT)%'

    App\Command\ProductionReadinessCheckCommand:
        arguments:
            $storageRoot: '%kernel.project_dir%/%env(PRODUCT_IMAGE_STORAGE_ROOT)%'
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'

    App\Command\BackupDatabaseCommand:
        arguments:
            $backupRoot: '%kernel.project_dir%/%env(PRODUCTION_BACKUP_ROOT)%'
            $mysqldumpBinary: '%env(MYSQLDUMP_BINARY)%'

    App\Application\Product\Command\AdjustStock\AdjustStockHandler:
        public: true

    App\Application\Statistics\Query\Period\StatisticsPeriodResolver:
        arguments:
            $appTimezone: '%env(APP_TIMEZONE)%'

    App\Application\Order\Command\Checkout\CheckoutHandler:
        arguments:
            $bankTransferCompletionPolicy: '%app.bank_transfer_completion_policy%'
